<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honey Island — Gestão de Recursos | Transparência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Hero (capa) — navy gradient + luminous hexagon */
    --navy-950:#0f2036;
    --navy-900:#1a3350;
    --navy-800:#284a6b;
    --navy-700:#3e6788;
    --steel-500:#7a97b0;
    --steel-300:#a8c1d4;
    --hex-glow:#cfe7f7;

    /* Interior — cream + graphite */
    --cream:#F2EEEA;
    --cream-tint:#EBE5DD;
    --cream-warm:#E7DFD3;
    --graphite:#595959;
    --graphite-90:#4a4a4a;
    --graphite-70:rgba(89,89,89,.72);
    --graphite-50:rgba(89,89,89,.55);
    --graphite-30:rgba(89,89,89,.32);
    --graphite-15:rgba(89,89,89,.18);
    --hairline-dark:rgba(89,89,89,.20);
    --hairline-light:rgba(242,238,234,.22);

    /* Text on navy */
    --on-navy-100:#F2EEEA;
    --on-navy-70:rgba(242,238,234,.72);
    --on-navy-50:rgba(242,238,234,.55);
    --on-navy-30:rgba(242,238,234,.35);

    --font-serif: 'DM Serif Display', ui-serif, Georgia, serif;
    --font-sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-cap: 'Roboto', 'Work Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--graphite);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{overflow-x:hidden;min-height:100vh}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}
  ::selection{background:var(--graphite);color:var(--cream)}

  /* ============ Chrome (fixed) ============ */
  .chrome{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 44px;
    transition:background .4s, backdrop-filter .4s, border-color .4s;
  }
  .chrome.on-navy{
    background:linear-gradient(180deg, rgba(15,32,54,.55) 0%, rgba(15,32,54,0) 100%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:var(--on-navy-100);
  }
  .chrome.on-cream{
    background:linear-gradient(180deg, rgba(242,238,234,.92) 0%, rgba(242,238,234,.5) 80%, rgba(242,238,234,0) 100%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--graphite);
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand-logo{height:28px;width:auto;display:block;flex:none;transition:opacity .3s}
  .brand-logo.dark{display:none}
  .chrome.on-cream .brand-logo.light{display:none}
  .chrome.on-cream .brand-logo.dark{display:block}
  .brand-divider{width:1px;height:22px;background:currentColor;opacity:.22}
  .brand-tag{
    font-family:var(--font-cap);
    font-size:10px;letter-spacing:.36em;text-transform:uppercase;
    white-space:nowrap;opacity:.7;font-weight:500;
  }
  .chrome-right{display:flex;align-items:center;gap:26px}
  .lang-toggle{display:flex;align-items:center;gap:10px;font-family:var(--font-cap);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500}
  .lang-toggle button{opacity:.4;transition:opacity .25s;padding:4px 2px}
  .lang-toggle button.on{opacity:1}
  .lang-toggle .sep{opacity:.25}

  /* ============ Hero (navy capa) ============ */
  .hero{
    position:relative;
    min-height:min(100vh, 900px);
    padding:180px 44px 100px;
    background:
      radial-gradient(ellipse 80% 50% at 15% 15%, #b8c4bd 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 90% 40%, #2a4a6b 0%, transparent 60%),
      linear-gradient(135deg, #536b7a 0%, #2c4560 40%, #1a3350 100%);
    color:var(--on-navy-100);
    overflow:hidden;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  /* Soft blur haze layer on top of gradient for the "photographic" feel */
  .hero::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 5% 10%, rgba(180,190,180,.35), transparent 60%),
      radial-gradient(ellipse 40% 30% at 20% 90%, rgba(15,32,54,.5), transparent 60%);
    pointer-events:none;
  }
  .hero-hex{
    position:absolute;right:-140px;top:20%;
    width:min(70vw, 900px);height:auto;
    opacity:.38;pointer-events:none;user-select:none;
    filter:blur(.5px);
  }
  .hero-inner{
    position:relative;z-index:2;
    max-width:1360px;margin:0 auto;width:100%;
    display:flex;flex-direction:column;justify-content:space-between;
    min-height:calc(min(100vh, 900px) - 280px);
  }
  .hero-top{
    display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;
    margin-top:20px;
  }
  .hero-side{padding-bottom:8px}
  .hero-eyebrow{
    font-family:var(--font-cap);
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--on-navy-70);font-weight:500;
    display:inline-flex;align-items:center;gap:14px;
  }
  .hero-eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
  .hero-title{
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(52px, 6.8vw, 104px);
    line-height:1.02;letter-spacing:-.015em;
    color:var(--on-navy-100);
    margin-top:32px;
    max-width:16ch;
  }
  .hero-title em{font-style:italic;font-weight:400;color:var(--hex-glow)}
  .hero-side p{
    font-family:var(--font-sans);font-weight:400;
    font-size:16px;line-height:1.7;color:var(--on-navy-70);
    max-width:440px;
  }
  .hero-bottom{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding-top:60px;
    font-family:var(--font-cap);font-size:11px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--on-navy-70);font-weight:500;
    border-top:1px solid var(--hairline-light);
    margin-top:60px;
  }
  .hero-bottom .item{display:flex;flex-direction:column;gap:10px}
  .hero-bottom .k{opacity:.55;font-size:9.5px}
  .hero-bottom .v{color:var(--on-navy-100);opacity:.95}

  /* ============ Container / general ============ */
  .container{max-width:1360px;margin:0 auto;padding:0 44px}
  .eyebrow{
    font-family:var(--font-cap);
    font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--graphite-70);font-weight:500;
    display:inline-flex;align-items:center;gap:12px;
  }
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--graphite-30)}
  .sec-num{
    font-family:var(--font-cap);
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--graphite-50);font-weight:500;
  }

  /* ============ About ============ */
  .about{
    background:var(--cream);
    padding:180px 0 140px;
    position:relative;
  }
  /* Sutil hex outline decoration */
  .about-hex{
    position:absolute;top:-80px;right:-100px;
    width:340px;height:auto;opacity:.45;pointer-events:none;
    filter:hue-rotate(190deg) saturate(.4);
  }
  .about-grid{
    display:grid;grid-template-columns:320px 1fr;gap:80px;align-items:start;
  }
  .about-label{display:flex;flex-direction:column;gap:20px}
  .about-title{
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(40px, 5vw, 76px);
    line-height:1.05;letter-spacing:-.015em;
    color:var(--graphite);
    max-width:920px;
  }
  .about-title em{font-style:italic;color:var(--navy-700)}
  .about-lead{
    margin-top:40px;
    font-family:var(--font-sans);font-weight:400;
    font-size:17px;line-height:1.75;color:var(--graphite);
    max-width:720px;
  }

  /* ============ Docs ============ */
  .docs{
    background:var(--cream-tint);
    padding:140px 0;position:relative;
    border-top:1px solid var(--hairline-dark);
  }
  .docs-head{
    display:grid;grid-template-columns:320px 1fr;gap:80px;
    align-items:end;margin-bottom:80px;
  }
  .docs-title{
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(40px, 4.6vw, 68px);line-height:1.02;letter-spacing:-.015em;
    color:var(--graphite);
  }
  .docs-title em{font-style:italic;color:var(--navy-700)}
  .docs-intro{
    font-size:15px;line-height:1.7;color:var(--graphite-70);
    max-width:520px;padding-bottom:14px;
  }
  .doc-index{
    border-top:1px solid var(--hairline-dark);
  }
  .doc-row{
    display:grid;grid-template-columns:60px 1fr 200px 60px;
    align-items:center;
    padding:30px 8px;
    border-bottom:1px solid var(--hairline-dark);
    color:var(--graphite);
    transition:padding .35s cubic-bezier(.2,.7,.1,1), background .4s;
    position:relative;
  }
  .doc-row::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg, rgba(89,89,89,.06), transparent);
    transition:width .5s cubic-bezier(.2,.7,.1,1);
    pointer-events:none;
  }
  .doc-row:hover{padding-left:26px}
  .doc-row:hover::before{width:100%}
  .doc-row:hover .doc-title{color:var(--navy-800)}
  .doc-row:hover .doc-arrow{transform:translateX(6px);color:var(--navy-800)}
  .doc-num{
    font-family:var(--font-serif);font-style:italic;font-weight:400;
    color:var(--navy-700);font-size:18px;
  }
  .doc-title{
    font-family:var(--font-serif);font-weight:400;
    font-size:26px;letter-spacing:-.005em;line-height:1.15;
    transition:color .3s;
  }
  .doc-meta{
    font-family:var(--font-cap);
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--graphite-50);text-align:right;padding-right:24px;font-weight:500;
  }
  .doc-arrow{
    display:inline-flex;align-items:center;justify-content:flex-end;
    transition:transform .35s, color .3s;color:var(--graphite-50);
  }

  /* ============ Contact ============ */
  .contact{
    background:var(--cream);
    padding:140px 0 160px;
    border-top:1px solid var(--hairline-dark);
  }
  .contact-grid{
    display:grid;grid-template-columns:320px 1fr;gap:80px;align-items:start;
  }
  .contact-title{
    font-family:var(--font-serif);font-weight:400;
    font-size:clamp(36px, 4.4vw, 64px);line-height:1.05;letter-spacing:-.015em;
    color:var(--graphite);
  }
  .contact-title em{font-style:italic;color:var(--navy-700)}
  .contact-cards{
    display:grid;grid-template-columns:repeat(2, 1fr);gap:40px;
    max-width:720px;margin-top:56px;
  }
  .contact-card{
    border-top:1px solid var(--hairline-dark);
    padding:24px 0;
  }
  .contact-card .k{
    font-family:var(--font-cap);
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--graphite-50);margin-bottom:14px;font-weight:500;
  }
  .contact-card .v{
    font-family:var(--font-serif);
    font-size:24px;font-weight:400;line-height:1.35;color:var(--graphite);
  }
  .contact-card .v a{transition:color .25s}
  .contact-card .v a:hover{color:var(--navy-700)}

  /* ============ Disclaimer band ============ */
  .disclaimer-band{
    background:var(--cream-warm);
    border-top:1px solid var(--hairline-dark);
    padding:64px 0;
  }
  .disclaimer-grid{
    display:grid;grid-template-columns:320px 1fr;gap:80px;align-items:start;
  }
  .disclaimer-label{display:flex;flex-direction:column;gap:14px}
  .disclaimer-label .dagger{
    font-family:var(--font-serif);font-style:italic;
    font-size:22px;color:var(--navy-700);
  }
  .disclaimer-text{
    font-family:var(--font-serif);font-style:italic;font-weight:400;
    font-size:17px;line-height:1.7;color:var(--graphite);
    max-width:820px;letter-spacing:.005em;
  }

  /* ============ Footer ============ */
  footer{
    background:var(--cream);
    border-top:1px solid var(--hairline-dark);
    padding:36px 0;
  }
  footer .fw{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:12px;
    font-family:var(--font-cap);
    font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--graphite-50);font-weight:500;
  }

  /* ============ Reveals ============ */
  .reveal{
    opacity:0;transform:translateY(24px);
    transition:opacity 1s cubic-bezier(.2,.7,.1,1), transform 1s cubic-bezier(.2,.7,.1,1);
  }
  .reveal.in{opacity:1;transform:none}

  /* ============ Responsive ============ */
  @media (max-width: 960px){
    .chrome{padding:16px 20px;gap:12px;flex-wrap:wrap}
    .chrome-right{gap:14px}
    .container{padding:0 20px}
    .hero{padding:140px 20px 60px;min-height:auto}
    .hero-top,.hero-bottom{grid-template-columns:1fr;gap:40px}
    .hero-bottom{flex-direction:column;align-items:flex-start;gap:20px;padding-top:40px;margin-top:40px}
    .hero-side p{margin-top:12px}
    .hero-hex{right:-50%;top:35%;width:130vw;opacity:.6}
    .about,.docs,.contact{padding:80px 0}
    .about-grid,.docs-head,.contact-grid,.disclaimer-grid{grid-template-columns:1fr;gap:32px}
    .contact-cards{grid-template-columns:1fr;gap:24px}
    .doc-row{grid-template-columns:36px 1fr 32px;padding:22px 4px}
    .doc-row .doc-meta{display:none}
    .doc-title{font-size:19px}
    .about-hex{display:none}
  }
</style>
</head>

    <div class="brand-divider"></div>

  </div>
  <div class="chrome-right">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button data-lang="pt" class="on">PT</button>
      <span class="sep">/</span>
      <button data-lang="en">EN</button>
    </div>
  </div>
</div>

<main>

  <!-- ==================== HERO (Sobre a Gestora) ==================== -->
  <section class="hero" id="hero" style="padding: 150px">
    <img class="hero-hex" src="assets/hex-glow.png" alt="" aria-hidden="true">
    <div class="hero-inner" style="width: 1078px">
      <div class="hero-top" style="width: 1178px; height: 463.625px">
        <div class="reveal" style="width: 559px; padding: 0px; margin: 0px">

        </div>
        <div class="hero-side reveal">
          <p data-i18n="about.lead" style="height: 380.938px"></p>
        </div>
      </div>
      <div class="hero-bottom reveal" style="height: 61px; flex-direction: row; gap: 0px; justify-content: space-between; align-items: flex-end">
        <div class="item"><span class="v" data-i18n="hero.city" style="height: 13px">Curitiba</span></div>
        <div class="item"><span class="v" data-i18n="hero.country">Brasil</span></div>
        <div class="item"><span class="v">2026</span></div>
      </div>
    </div>
  </section>

  <!-- ==================== ABOUT (Transparência & Compliance) ==================== -->
  <section class="about" id="about">
    <div class="container">
      <div class="about-grid">
        <div class="about-label reveal">
          <span class="sec-num"></span>
          <span class="eyebrow" data-i18n="hero.eyebrow">Transparência & Compliance</span>
        </div>
        <div class="reveal">
          <h2 class="about-title" data-i18n="hero.title"></h2>
          <p class="about-lead" data-i18n="hero.lead"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== DOCS ==================== -->
  <section class="docs" id="docs">
    <div class="container">
      <div class="docs-head">
        <div class="reveal" style="display:flex;flex-direction:column;gap:20px">
          <span class="sec-num"></span>
          <span class="eyebrow" data-i18n="docs.eyebrow">Documentos Regulatórios</span>
        </div>
        <div class="reveal">
          <h2 class="docs-title" data-i18n="docs.title"></h2>
          <p class="docs-intro" data-i18n="docs.intro"></p>
        </div>
      </div>
      <div class="doc-index reveal" id="docList"></div>
    </div>
  </section>

  <!-- ==================== CONTACT ==================== -->
  <section class="contact" id="contact">
    <div class="container">
      <div class="contact-grid">
        <div class="reveal" style="display:flex;flex-direction:column;gap:20px">
          <span class="sec-num"></span>
          <span class="eyebrow" data-i18n="contact.eyebrow">Contato de Compliance</span>
        </div>
        <div class="reveal">
          <h2 class="contact-title" data-i18n="contact.title"></h2>
          <div class="contact-cards">
            <div class="contact-card">
              <div class="k" data-i18n="contact.email">E-mail</div>
              <div class="v"><a class="email-link" data-user="compliance" data-host="hi.capital"></a></div>
            </div>
            <div class="contact-card">
              <div class="k" data-i18n="contact.address">Endereço</div>
              <div class="v" data-i18n="contact.addr">Curitiba, Paraná — Brasil</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== DISCLAIMER ==================== -->
  <section class="disclaimer-band">
    <div class="container">
      <div class="disclaimer-grid">
        <div class="disclaimer-label reveal">
          <span class="eyebrow" data-i18n="disclaimer.label">Aviso Regulatório</span>
        </div>
        <p class="disclaimer-text reveal" data-i18n="hero.disclaimer"></p>
      </div>
    </div>
  </section>

  <footer>
    <div class="container fw">
      <span data-i18n="footer.copy">© 2026 Honey Island Gestão de Recursos Ltda.</span>
      <span data-i18n="footer.reg">CNPJ 64.455.911/0001-96</span>
    </div>
  </footer>
</main>

    "contact.email":"Email",
    "contact.address":"Address",
    "contact.addr":"Curitiba, Paraná — Brazil",

    "disclaimer.label":"Regulatory Notice",
    "footer.copy":"© 2026 Honey Island Gestão de Recursos Ltda.",
    "footer.reg":"CNPJ 64.455.911/0001-96",
    "doc.meta":"PDF · Document"
  }
};

const DOCS = [
  { id:"investimentos-pessoais", pt:"Política de Investimentos Pessoais",             en:"Personal Trading Policy" },
  { id:"rateio-ordens",          pt:"Política de Rateio e Divisão de Ordens",          en:"Trade Allocation & Apportionment Policy" },
  { id:"codigo-etica",           pt:"Código de Ética",                                 en:"Code of Ethics" },
  { id:"manual-rpci",            pt:"Manual de Regras, Procedimentos e Controles Internos", en:"Manual of Rules, Procedures and Internal Controls" },
  { id:"politica-voto",          pt:"Política de Voto",                                en:"Proxy Voting Policy" },
  { id:"gestao-riscos",          pt:"Política de Gestão de Riscos",                    en:"Risk Management Policy" },
  { id:"formulario-referencia",  pt:"Formulário de Referência",                        en:"Reference Form" }
];

const state = { lang: localStorage.getItem("hi.lang") || "pt" };

function applyI18n(){
  document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
  const dict = I18N[state.lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(dict[k] != null) el.innerHTML = dict[k];
  });
  renderDocs();
  document.querySelectorAll(".lang-toggle button").forEach(b=>{
    b.classList.toggle("on", b.dataset.lang === state.lang);
  });
}

function renderDocs(){
  const dict = I18N[state.lang];
  const idx = document.getElementById("docList");
  idx.innerHTML = DOCS.map((d,i)=>`
    <a class="doc-row" href="#${d.id}" data-doc="${d.id}">
      <span class="doc-num">${String(i+1).padStart(2,"0")}</span>
      <span class="doc-title">${d[state.lang]}</span>
      <span class="doc-meta">${dict["doc.meta"]}</span>
      <span class="doc-arrow" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M6 12h12M13 6l6 6-6 6"/>
        </svg>
      </span>
    </a>
  `).join("");
}

document.querySelectorAll(".lang-toggle button").forEach(b=>{
  b.addEventListener("click",()=>{
    state.lang = b.dataset.lang;
    localStorage.setItem("hi.lang", state.lang);
    applyI18n();
  });
});

/* ================== Reveals ================== */
let io;
function observeReveals(){
  if(io) io.disconnect();
  const vh = window.innerHeight || document.documentElement.clientHeight;
  document.querySelectorAll(".reveal:not(.in)").forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh * 1.1) el.classList.add("in");
  });
  if("IntersectionObserver" in window){
    io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    },{threshold:.05, rootMargin:"0px 0px -40px 0px"});
    document.querySelectorAll(".reveal:not(.in)").forEach(el=>io.observe(el));
  }
  setTimeout(()=>{
    document.querySelectorAll(".reveal:not(.in)").forEach(el=>el.classList.add("in"));
  }, 800);
}
window.addEventListener("scroll", ()=>{
  const vh = window.innerHeight;
  document.querySelectorAll(".reveal:not(.in)").forEach(el=>{
    const r = el.getBoundingClientRect();
    if(r.top < vh * 0.95) el.classList.add("in");
  });
}, {passive:true});

/* ================== Chrome color switch based on hero visibility ================== */
function updateChrome(){
  const hero = document.getElementById("hero");
  const chrome = document.getElementById("chrome");
  const heroBottom = hero.getBoundingClientRect().bottom;
  if(heroBottom > 78){
    chrome.classList.add("on-navy");
    chrome.classList.remove("on-cream");
  } else {
    chrome.classList.add("on-cream");
    chrome.classList.remove("on-navy");
  }
}
window.addEventListener("scroll", updateChrome, {passive:true});
window.addEventListener("resize", updateChrome);

/* ================== Email hydration ================== */
function hydrateEmails(){
  document.querySelectorAll('a.email-link').forEach(a=>{
    const u = a.getAttribute('data-user');
    const h = a.getAttribute('data-host');
    if(!u || !h) return;
    const addr = u + '@' + h;
    a.setAttribute('href', 'mailto:' + addr);
    a.textContent = addr;
  });
}

/* ================== Init ================== */
applyI18n();
observeReveals();
hydrateEmails();
updateChrome();
</script>
